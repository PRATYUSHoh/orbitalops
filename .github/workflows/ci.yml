name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite (Jest & Supertest)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Run Backend Test Suite (Validation, Idempotency, Queue Backoff, DLQ)
        env:
          NODE_ENV: test
          PORT: 3001
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          cd backend
          npm test
